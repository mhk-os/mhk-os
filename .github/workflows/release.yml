# Release: every push to main builds the game for all release targets and publishes the GitHub release build-<sha7>
# with an installer per desktop target (Windows setup .exe, Linux self-extracting .run, macOS .dmg) and the Android APK.
# Secrets: UNITY_LICENSE (contents of a Unity Personal .ulf file), UNITY_EMAIL, UNITY_PASSWORD, UNITY_SERIAL (Pro only),
# MODS_REPO_TOKEN (read access to the base mod repositories) only while one of them is private. Variables (optional):
# BASE_MODS (space separated repositories, default the four below), BASE_MODS_REF (default main), LIBRARY_CACHE (false
# turns the game's Library cache off), MOD_LIBRARY_CACHE (false turns the Library caches of the base mods off).
# Every Unity run uses a GameCI docker image on ubuntu: desktop players use Mono, Android IL2CPP ARM64 (Player
# Settings). Unity 6.6 has no desktop Linux Arm64 player, so there is no linux-arm64 build. The base mods are built from
# their repositories (one commit per run, from BASE_MODS_REF) with this commit's SDK checked out next to them, once per
# Unity build target. The Android player waits for the Android mod builds and packs them (-mhkExtraMods). Desktop
# players need no mods to build and start right after prepare. The installer jobs put each mod into Mods/<id>/ next to
# the player (the same files -mhkExtraMods would copy) and run Tools/installer/package.sh. Intermediate builds travel as
# workflow artifacts kept for one day, installers go straight into a draft release and the last job publishes it.
# Caches (10 GB per repository): LFS objects of the game and of each base mod, the game's Library per Unity build target
# (the two macOS and the two Windows builds share one), each base mod's Library for its three desktop targets (one
# Library serves them, a target switch reimports only a few platform dependent assets) and for Android. Set
# MOD_LIBRARY_CACHE to false if they evict the LFS caches. The publish job removes caches superseded by a newer key
# for at least three hours.
# Identity: the commit only (-mhkCommit, no version number). Build number: the number of commits on main (release
# title "Build <n> | <sha7>", Android versionCode and macOS build number).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BASE_MODS: ${{ vars.BASE_MODS || 'mhk-os/mhk2-mod mhk-os/mhk3-mod mhk-os/mhke-mod mhk-os/mhkt-mod' }}
  BASE_MODS_REF: ${{ vars.BASE_MODS_REF || 'main' }}

jobs:
  prepare:
    name: Base mods, LFS cache and draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      lfs-key: ${{ steps.lfs.outputs.key }}
      mods: ${{ steps.mods.outputs.mods }}
      sha7: ${{ steps.meta.outputs.sha7 }}
      tag: ${{ steps.meta.outputs.tag }}
      number: ${{ steps.meta.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      - id: meta
        run: |
          sha7="${GITHUB_SHA::7}"
          {
            echo "sha7=$sha7"
            echo "tag=build-$sha7"
            echo "number=$(git rev-list --count HEAD)"
          } >> "$GITHUB_OUTPUT"

      - id: mods
        env:
          GH_TOKEN: ${{ secrets.MODS_REPO_TOKEN || github.token }}
        run: |
          mods="[]"
          for repo in $BASE_MODS; do
            commit=$(gh api "repos/$repo/commits/$BASE_MODS_REF" --jq .sha)
            mods=$(jq -c --arg repo "$repo" --arg commit "$commit" '. + [{repo: $repo, name: ($repo | split("/")[1]), commit: $commit}]' <<< "$mods")
          done
          echo "mods=$mods" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "\(.repo) \(.commit)"' <<< "$mods" > "$RUNNER_TEMP/mods.txt"

      # LFS objects are downloaded once per set of binaries (key: the object list of this commit) and shared by all
      # builds through the cache. A miss starts from the newest older set, so only changed files use LFS bandwidth.
      - id: lfs
        run: echo "key=lfs-game-$(git lfs ls-files --long | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - id: lfs-exact
        uses: actions/cache/restore@v6
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs.outputs.key }}
          lookup-only: true

      - if: steps.lfs-exact.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs.outputs.key }}
          restore-keys: |
            lfs-game-
            lfs-

      - if: steps.lfs-exact.outputs.cache-hit != 'true'
        run: |
          git lfs fetch
          git lfs prune || echo "::warning::git lfs prune failed, the LFS cache keeps older objects"

      - if: steps.lfs-exact.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs.outputs.key }}

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHA7: ${{ steps.meta.outputs.sha7 }}
          NUMBER: ${{ steps.meta.outputs.number }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then exit 0; fi
          notes="$RUNNER_TEMP/notes.txt"
          {
            echo "Moorhuhn Kart: Open Source, commit $GITHUB_SHA"
            echo
            echo "Windows: MHK-windows-x64-$SHA7-setup.exe (windows-arm64 for Windows on Arm)."
            echo "macOS: open the .dmg and drag the folder Moorhuhn Kart OSE into Applications, allow the app once in System Settings, Privacy & Security."
            echo "Linux: sh MHK-linux-x64-$SHA7.run"
            echo "Android: MHK-android-$SHA7.apk"
            echo
            echo "Base mods:"
            sed 's/^/- /' "$RUNNER_TEMP/mods.txt"
            echo
            git log -1 --format=%B
          } > "$notes"
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Build $NUMBER | $SHA7" --notes-file "$notes"

  mod-lfs:
    name: LFS cache ${{ matrix.mod.name }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mod: ${{ fromJSON(needs.prepare.outputs.mods) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.mod.repo }}
          ref: ${{ matrix.mod.commit }}
          token: ${{ secrets.MODS_REPO_TOKEN || github.token }}
          path: mod
          lfs: false

      - id: lfs
        working-directory: mod
        run: echo "key=lfs-mod-${{ matrix.mod.name }}-$(git lfs ls-files --long | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - id: lfs-exact
        uses: actions/cache/restore@v6
        with:
          path: mod/.git/lfs/objects
          key: ${{ steps.lfs.outputs.key }}
          lookup-only: true

      - if: steps.lfs-exact.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: mod/.git/lfs/objects
          key: ${{ steps.lfs.outputs.key }}
          restore-keys: lfs-mod-${{ matrix.mod.name }}-

      - if: steps.lfs-exact.outputs.cache-hit != 'true'
        working-directory: mod
        run: |
          git lfs fetch
          git lfs prune || echo "::warning::git lfs prune failed, the LFS cache keeps older objects"

      - if: steps.lfs-exact.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: mod/.git/lfs/objects
          key: ${{ steps.lfs.outputs.key }}

  # One job per mod and Unity build target. The Android player waits only for mods-android, each desktop installer
  # only for the mod builds of its target. The job definitions share their steps through YAML anchors.
  mods-android:
    name: Mod ${{ matrix.mod.name }} ${{ matrix.platform }}
    needs: [prepare, mod-lfs]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.prepare.outputs.mods) }}
        platform: [Android]
    steps: &mod-steps
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.mod.repo }}
          ref: ${{ matrix.mod.commit }}
          token: ${{ secrets.MODS_REPO_TOKEN || github.token }}
          path: mod
          lfs: false

      - id: lfs
        working-directory: mod
        run: echo "key=lfs-mod-${{ matrix.mod.name }}-$(git lfs ls-files --long | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        with:
          path: mod/.git/lfs/objects
          key: ${{ steps.lfs.outputs.key }}
          fail-on-cache-miss: true

      - working-directory: mod
        run: git lfs checkout

      - uses: actions/checkout@v7
        with:
          path: mhk-os
          sparse-checkout: Packages/org.mhkose.sdk
          sparse-checkout-cone-mode: true
          lfs: false

      - working-directory: mhk-os
        run: git lfs pull --include "Packages/org.mhkose.sdk/**"

      - id: packs
        working-directory: mod
        run: |
          mapfile -t packs < <(grep -rlx --include='*.asset' '  m_EditorClassIdentifier: MHK.Runtime::MHK.Modding.ContentPack' Packages | sort)
          if [ "${#packs[@]}" -eq 0 ]; then echo "::error::No ContentPack asset under Packages/"; exit 1; fi
          ids=""
          for pack in "${packs[@]}"; do ids+="$(sed -n 's/^  packId: *//p' "$pack" | tr -d '\r' | tr '[:upper:]' '[:lower:]') "; done
          echo "packs=$(IFS=,; echo "${packs[*]}")" >> "$GITHUB_OUTPUT"
          echo "ids=${ids% }" >> "$GITHUB_OUTPUT"

      - if: vars.MOD_LIBRARY_CACHE != 'false'
        uses: actions/cache@v6
        with:
          path: mod/Library
          key: Library-${{ matrix.mod.name }}-${{ matrix.platform == 'Android' && 'Android' || 'desktop' }}-${{ hashFiles('mod/ProjectSettings/ProjectVersion.txt', 'mod/Packages/packages-lock.json') }}
          restore-keys: Library-${{ matrix.mod.name }}-${{ matrix.platform == 'Android' && 'Android' || 'desktop' }}-

      # Library/*.pid hold the Burst and ILPP process ids of the run that saved the cache. Container process ids
      # repeat, and Unity kills the process with that id at startup, sometimes the editor itself (exit code 137).
      - run: rm -f mod/Library/*.pid

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: mod
          targetPlatform: ${{ matrix.platform }}
          buildMethod: MHK.Editor.Modding.ModBuildCli.Build
          customParameters: -mhkPacks ${{ steps.packs.outputs.packs }} -mhkOut Builds/Mods -mhkCommit ${{ matrix.mod.commit }} -mhkSdkCommit ${{ github.sha }}
          versioning: None
          allowDirtyBuild: true

      - name: Pack
        env:
          IDS: ${{ steps.packs.outputs.ids }}
          OUT: mod/Builds/Mods/${{ matrix.platform }}
          TAR: ${{ runner.temp }}/mod-${{ matrix.mod.name }}-${{ matrix.platform }}.tar
        run: |
          sudo chown -R "$(id -u):$(id -g)" mod/Builds
          read -ra ids <<< "$IDS"
          for id in "${ids[@]}"; do
            if [ ! -f "$OUT/$id/$id.mhkmod" ]; then echo "::error::$id.mhkmod was not built for ${{ matrix.platform }}"; exit 1; fi
          done
          tar -cf "$TAR" -C "$OUT" "${ids[@]}"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/mod-${{ matrix.mod.name }}-${{ matrix.platform }}.tar
          archive: false
          retention-days: 1
          if-no-files-found: error

  mods-macos:
    name: Mod ${{ matrix.mod.name }} ${{ matrix.platform }}
    needs: [prepare, mod-lfs]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.prepare.outputs.mods) }}
        platform: [StandaloneOSX]
    steps: *mod-steps

  mods-linux:
    name: Mod ${{ matrix.mod.name }} ${{ matrix.platform }}
    needs: [prepare, mod-lfs]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.prepare.outputs.mods) }}
        platform: [StandaloneLinux64]
    steps: *mod-steps

  mods-windows:
    name: Mod ${{ matrix.mod.name }} ${{ matrix.platform }}
    needs: [prepare, mod-lfs]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.prepare.outputs.mods) }}
        platform: [StandaloneWindows64]
    steps: *mod-steps

  build-desktop:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, platform: StandaloneOSX }
          - { target: macos-x64, platform: StandaloneOSX }
          - { target: linux-x64, platform: StandaloneLinux64 }
          - { target: windows-x64, platform: StandaloneWindows64 }
          - { target: windows-arm64, platform: StandaloneWindows64 }
    env:
      TARGET: ${{ matrix.target }}
      ASSET: MHK-${{ matrix.target }}-${{ needs.prepare.outputs.sha7 }}
    steps: &build-steps
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/cache/restore@v6
        with:
          path: .git/lfs/objects
          key: ${{ needs.prepare.outputs.lfs-key }}
          fail-on-cache-miss: true

      - run: git lfs checkout

      - if: matrix.target == 'android'
        uses: actions/download-artifact@v8
        with:
          pattern: mod-*-${{ matrix.platform }}.tar
          path: ${{ runner.temp }}/mods
          merge-multiple: true

      # Inside the workspace: the Unity container sees only the workspace.
      - if: matrix.target == 'android'
        run: |
          mkdir -p build/shipped-mods
          for tar in "$RUNNER_TEMP"/mods/*.tar; do tar -xf "$tar" -C build/shipped-mods; done
          ls build/shipped-mods

      - if: vars.LIBRARY_CACHE != 'false'
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ matrix.platform }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/packages-lock.json') }}
          restore-keys: Library-${{ matrix.platform }}-

      - run: rm -f Library/*.pid

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: ${{ matrix.platform }}
          buildMethod: MHK.Editor.Build.CiBuild.Build
          customParameters: -mhkTarget ${{ matrix.target }} -mhkOut build/${{ matrix.target }} ${{ matrix.target == 'android' && '-mhkExtraMods build/shipped-mods' || '' }} -mhkCommit ${{ github.sha }} -mhkBuildCode ${{ needs.prepare.outputs.number }}
          versioning: None
          allowDirtyBuild: true

      - run: sudo chown -R "$(id -u):$(id -g)" "build/$TARGET"

      - if: matrix.target == 'android'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mv "build/$TARGET/MoorhuhnKart.apk" "$RUNNER_TEMP/$ASSET.apk"
          gh release upload "$TAG" "$RUNNER_TEMP/$ASSET.apk" --clobber

      - if: matrix.target != 'android'
        run: tar -cf "$RUNNER_TEMP/game-$TARGET.tar" -C "build/$TARGET" --exclude='*_DoNotShip' --exclude='*_ButDontShipItWithYourGame' .

      - if: matrix.target != 'android'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/game-${{ matrix.target }}.tar
          archive: false
          retention-days: 1
          if-no-files-found: error

  build-android:
    name: Build ${{ matrix.target }}
    needs: [prepare, mods-android]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { target: android, platform: Android }
    env:
      TARGET: ${{ matrix.target }}
      ASSET: MHK-${{ matrix.target }}-${{ needs.prepare.outputs.sha7 }}
    steps: *build-steps

  package-windows:
    name: Installer ${{ matrix.target }}
    needs: [prepare, build-desktop, mods-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { target: windows-x64, platform: StandaloneWindows64 }
          - { target: windows-arm64, platform: StandaloneWindows64 }
    env:
      TARGET: ${{ matrix.target }}
      ASSET: MHK-${{ matrix.target }}-${{ needs.prepare.outputs.sha7 }}
    steps: &package-steps
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Tools/installer
          lfs: false

      - run: git lfs pull --include "Tools/installer/*"

      - uses: actions/download-artifact@v8
        with:
          name: game-${{ matrix.target }}.tar
          path: ${{ runner.temp }}

      - uses: actions/download-artifact@v8
        with:
          pattern: mod-*-${{ matrix.platform }}.tar
          path: ${{ runner.temp }}/mods
          merge-multiple: true

      - name: Package
        env:
          NUMBER: ${{ needs.prepare.outputs.number }}
          SHA7: ${{ needs.prepare.outputs.sha7 }}
        run: |
          game="$RUNNER_TEMP/game"
          mkdir -p "$game/Mods"
          tar -xf "$RUNNER_TEMP/game-$TARGET.tar" -C "$game"
          for tar in "$RUNNER_TEMP"/mods/*.tar; do tar -xf "$tar" -C "$game/Mods"; done
          rm -r "$RUNNER_TEMP/game-$TARGET.tar" "$RUNNER_TEMP/mods"
          case "$TARGET" in
            windows-*) file="$RUNNER_TEMP/$ASSET-setup.exe"; tool=nsis ;;
            *) file="$RUNNER_TEMP/$ASSET.run"; tool=makeself ;;
          esac
          sudo apt-get update -qq
          sudo apt-get install -y -qq "$tool" > /dev/null
          Tools/installer/package.sh "$TARGET" "$game" "$file" "$NUMBER" "$SHA7"
          echo "FILE=$file" >> "$GITHUB_ENV"

      - name: Check the Linux installer
        if: startsWith(matrix.target, 'linux-')
        run: |
          build="$RUNNER_TEMP/game"
          export HOME="$RUNNER_TEMP/home" XDG_DATA_HOME="$RUNNER_TEMP/home/share"
          dir="$HOME/Games/Moorhuhn Kart OSE"
          "$FILE" --quiet -- --yes
          "$FILE" --quiet -- --dir "$dir" --yes
          test -x "$dir/MoorhuhnKart.x86_64"
          for mod in "$build"/Mods/*/; do test -d "$dir/Mods/$(basename "$mod")/Assets"; done
          grep -qxF "Path=$dir" "$XDG_DATA_HOME/applications/org.mhkose.moorhuhnkart.desktop"
          "$dir/uninstall.sh" --yes
          test ! -e "$dir" && test ! -e "$XDG_DATA_HOME/applications/org.mhkose.moorhuhnkart.desktop"

      - if: startsWith(matrix.target, 'windows-')
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.FILE }}
          archive: false
          retention-days: 1
          if-no-files-found: error

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" "$FILE" --clobber

  package-linux:
    name: Installer ${{ matrix.target }}
    needs: [prepare, build-desktop, mods-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { target: linux-x64, platform: StandaloneLinux64 }
    env:
      TARGET: ${{ matrix.target }}
      ASSET: MHK-${{ matrix.target }}-${{ needs.prepare.outputs.sha7 }}
    steps: *package-steps

  dmg:
    name: Disk image ${{ matrix.target }}
    needs: [prepare, build-desktop, mods-macos]
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target: [macos-arm64, macos-x64]
    env:
      TARGET: ${{ matrix.target }}
      ASSET: MHK-${{ matrix.target }}-${{ needs.prepare.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Tools/installer
          lfs: false

      - uses: actions/download-artifact@v8
        with:
          name: game-${{ matrix.target }}.tar
          path: ${{ runner.temp }}

      - uses: actions/download-artifact@v8
        with:
          pattern: mod-*-StandaloneOSX.tar
          path: ${{ runner.temp }}/mods
          merge-multiple: true

      - run: |
          game="$RUNNER_TEMP/game"
          mkdir -p "$game/Mods"
          tar -xf "$RUNNER_TEMP/game-$TARGET.tar" -C "$game"
          for tar in "$RUNNER_TEMP"/mods/*.tar; do tar -xf "$tar" -C "$game/Mods"; done
          rm -r "$RUNNER_TEMP/game-$TARGET.tar" "$RUNNER_TEMP/mods"
          echo "DMG=$RUNNER_TEMP/$ASSET.dmg" >> "$GITHUB_ENV"
          Tools/installer/package.sh "$TARGET" "$game" "$RUNNER_TEMP/$ASSET.dmg" "${{ needs.prepare.outputs.number }}" "${{ needs.prepare.outputs.sha7 }}"

      - name: Check the image
        run: |
          mount=$(hdiutil attach -nobrowse -readonly "$DMG" | sed -n 's|.*\(/Volumes/.*\)$|\1|p' | tail -1)
          folder="$mount/Moorhuhn Kart OSE"
          codesign --verify --deep --strict "$folder/MoorhuhnKart.app"
          for mod in "$RUNNER_TEMP"/game/Mods/*/; do test -d "$folder/Mods/$(basename "$mod")"; done
          test -L "$mount/Applications"
          hdiutil detach "$mount"

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$DMG" --clobber

  windows-check:
    name: Install check ${{ matrix.target }}
    needs: [prepare, package-windows]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: windows-x64, runner: windows-latest }
          - { target: windows-arm64, runner: windows-11-arm }
    env:
      SETUP: MHK-${{ matrix.target }}-${{ needs.prepare.outputs.sha7 }}-setup.exe
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.SETUP }}
          path: ${{ runner.temp }}

      # Silent install, an update over it, then the uninstaller in place (_?=), which leaves itself and foreign files.
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'Moorhuhn Kart OSE'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MoorhuhnKartOSE'
          function Run($exe, $arguments) {
            $p = Start-Process $exe -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$exe exit code $($p.ExitCode)" }
          }
          Run (Join-Path $env:RUNNER_TEMP $env:SETUP) "/S /D=$dir"
          foreach ($f in 'MoorhuhnKart.exe', 'Uninstall.exe', 'MoorhuhnKart.ico', 'Mods\core\core.mhkmod') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Missing $f" }
          }
          Write-Output "Mods: $((Get-ChildItem (Join-Path $dir 'Mods') -Directory).Name -join ', ')"
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Moorhuhn Kart OSE.lnk'))) { throw 'No Start menu shortcut' }
          if ((Get-ItemProperty $key).InstallLocation -ne $dir) { throw 'No Apps and Features entry' }
          Set-Content (Join-Path $dir 'Mods\core\stale.txt') 'old build'
          New-Item -ItemType Directory (Join-Path $dir 'Mods\mymod') | Out-Null
          Set-Content (Join-Path $dir 'Mods\mymod\my.mhkmod') 'own mod'
          Run (Join-Path $env:RUNNER_TEMP $env:SETUP) "/S /D=$dir"
          if (Test-Path (Join-Path $dir 'Mods\core\stale.txt')) { throw 'The update kept a file of the old build' }
          Run (Join-Path $dir 'Uninstall.exe') "/S _?=$dir"
          $left = (Get-ChildItem $dir -Recurse -Name | Sort-Object) -join ' | '
          if ($left -ne 'Mods | Mods\mymod | Mods\mymod\my.mhkmod | Uninstall.exe') { throw "Left after uninstall: $left" }
          if (Test-Path $key) { throw 'Apps and Features entry left' }

  publish:
    name: Publish release
    needs: [prepare, build-android, package-linux, dmg, windows-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Remove superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 1000 --json id,key,createdAt,lastAccessedAt |
            jq -r 'map(select(.key | test("-[0-9a-f]{64}$"))) | group_by(.key | sub("-[0-9a-f]{64}$"; ""))
              | map(sort_by(.createdAt) | .[:-1][]) | .[]
              | select((.lastAccessedAt | sub("\\.[0-9]+"; "") | fromdateiso8601) < (now - 10800)) | .id' |
            while read -r id; do gh cache delete --repo "$GITHUB_REPOSITORY" "$id"; done
